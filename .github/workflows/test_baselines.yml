name: Test baselines

on:
  push:
    branches:
      - '**'
    paths:
      - "scripts/baselines.py"
      - "scripts/baselines_clusters.py"
      - "scripts/clustered_routes.py"
      - "scripts/utils.py"
      - "config/**"
      - "baseline_models/**"
      - "analysis/**"
      - "tests/test_baselines.py"
      - ".github/workflows/test_baselines.yml"
  pull_request:
    branches:
      - '**'
    paths:
      - "scripts/baselines.py"
      - "scripts/baselines_clusters.py"
      - "scripts/clustered_routes.py"
      - "scripts/utils.py"
      - "config/**"
      - "baseline_models/**"
      - "analysis/**"
      - "tests/test_baselines.py"
      - ".github/workflows/test_baselines.yml"
  workflow_dispatch:

jobs:
  test-baselines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools sumo-doc
          echo "SUMO_HOME=/usr/share/sumo" >> $GITHUB_ENV
          echo "/usr/share/sumo/bin" >> $GITHUB_PATH

      - name: Verify SUMO installation
        run: |
          echo "SUMO_HOME is set to $SUMO_HOME"
          sumo --version

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade "pip<26"
          python -m pip --version
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run script tests
        run: python -m pytest -rs tests/test_baselines.py
