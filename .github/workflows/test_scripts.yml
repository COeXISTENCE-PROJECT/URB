name: Test scripts

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
  pull_request:
    branches: [main]
    paths:
      - "scripts/*.py"

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find added or modified scripts
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          paths=$(git diff --diff-filter=AM --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'scripts/*.py')
          if [[ -n "$paths" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "paths<<EOF"
            echo "$paths"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Python Setup
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install SUMO
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y sumo sumo-tools sumo-doc
          echo "SUMO_HOME=/usr/share/sumo" >> $GITHUB_ENV
          echo "/usr/share/sumo/bin" >> $GITHUB_PATH

      - name: Verify SUMO installation
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          echo "SUMO_HOME is set to $SUMO_HOME"
          sumo --version

      - name: Install dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run script tests
        if: steps.changed.outputs.has_changes == 'true'
        env:
          URB_TEST_SCRIPTS: ${{ steps.changed.outputs.paths }}
        run: python -m pytest -rs tests/test_scripts.py
